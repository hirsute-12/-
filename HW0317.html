<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8" />
    <title>午餐代訂系統</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }
        .form-container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 30px;
            border-bottom: 2px solid #e67e22;
            padding-bottom: 10px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label.section-title {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #34495e;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #e67e22;
            box-shadow: 0 0 5px rgba(230,126,34,0.3);
        }
        .menu-category {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .category-title {
            font-weight: bold;
            color: #7f8c8d;
            margin-bottom: 10px;
            font-size: 0.9rem;
            border-left: 3px solid #e67e22;
            padding-left: 8px;
        }
        .checkbox-option {
            margin: 12px 0;
            display: flex;
            align-items: center;
            cursor: pointer;
            color: #2c3e50;
        }
        .checkbox-option input {
            margin-right: 12px;
            transform: scale(1.2);
            cursor: pointer;
        }
        .btn-group {
            text-align: center;
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }
        input[type="submit"], input[type="reset"] {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        input[type="submit"] {
            background-color: #e67e22;
            color: white;
        }
        input[type="submit"]:hover {
            background-color: #d35400;
        }
        input[type="reset"] {
            background-color: #95a5a6;
            color: white;
        }
        input[type="reset"]:hover {
            background-color: #7f8c8d;
        }
        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #e67e22;
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h1>午餐代訂系統</h1>
        
        <form id="form1" name="form1" method="post" action="lunch_submit.php">
            
            <div class="input-group">
                <label for="text1" class="section-title">訂購日期</label>
                <input type="text" name="text1" id="text1" placeholder="例如：2026-05-20" required />
            </div>

            <div class="input-group">
                <label for="text2" class="section-title">訂購人姓名</label>
                <input type="text" name="text2" id="text2" placeholder="請輸入姓名" required />
            </div>

            <label class="section-title">餐點選單 (可複選)</label>
            
            <div class="menu-category">
                <div class="category-title">主食類 (NT$ 45)</div>
                <label class="checkbox-option">
                    <input type="checkbox" name="lunch_items[]" value="麵" /> 麵 (45)
                </label>
                <label class="checkbox-option">
                    <input type="checkbox" name="lunch_items[]" value="粿仔" /> 粿仔 (45)
                </label>
                <label class="checkbox-option">
                    <input type="checkbox" name="lunch_items[]" value="米粉" /> 米粉 (45)
                </label>
                <label class="checkbox-option">
                    <input type="checkbox" name="lunch_items[]" value="冬粉" /> 冬粉 (45)
                </label>
            </div>

            <div class="menu-category">
                <div class="category-title">湯品類</div>
                <label class="checkbox-option">
                    <input type="checkbox" name="lunch_items[]" value="綜合湯" /> 綜合湯 (25)
                </label>
                <label class="checkbox-option">
                    <input type="checkbox" name="lunch_items[]" value="丸子湯" /> 丸子湯 (20)
                </label>
                <label class="checkbox-option">
                    <input type="checkbox" name="lunch_items[]" value="豆乾湯" /> 豆乾湯 (15)
                </label>
                <label class="checkbox-option">
                    <input type="checkbox" name="lunch_items[]" value="青菜湯" /> 青菜湯 (20)
                </label>
            </div>

            <div class="menu-category">
                <div class="category-title">單點小菜</div>
                <label class="checkbox-option">
                    <input type="checkbox" name="lunch_items[]" value="滷蛋" /> 滷蛋 (15)
                </label>
                <label class="checkbox-option">
                    <input type="checkbox" name="lunch_items[]" value="自製辣椒" /> 自製辣椒 (200)
                </label>
            </div>

            <div class="btn-group">
                <input type="submit" name="button1" id="button1" value="確認送出訂單" />
                <input type="reset" name="button2" id="button2" value="重新填寫" />
            </div>
        </form>

        <a href="index.html" class="back-home">← 回到首頁</a>
    </div>
</body>
</html>
